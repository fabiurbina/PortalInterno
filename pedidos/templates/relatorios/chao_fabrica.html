<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chão de Fábrica</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            margin: 0;
            padding: 20px;
        }


        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }


        /* =========================
           CARD
           ========================= */

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }


        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #212529;
            font-size: 28px;
        }


        /* =========================
           BOTÃO VOLTAR
           ========================= */

        .btn-voltar {
            display: inline-block;

            margin-top: 20px;

            padding: 10px 15px;

            background-color: #0D3B66;

            color: white;

            text-decoration: none;

            border-radius: 5px;

            font-size: 14px;
        }


        .btn-voltar:hover {
            background-color: #092f52;
        }


        /* =========================
           TABELA
           ========================= */

        .tabela-container {
            width: 100%;

            overflow-x: auto;

            border-radius: 5px;
        }


        table {
            width: 100%;

            min-width: 1200px;

            border-collapse: collapse;

            table-layout: fixed;
        }


        th {
            background-color: #0D3B66;

            color: white;

            padding: 10px 8px;

            text-align: left;

            font-size: 12px;

            white-space: normal;

            overflow-wrap: break-word;
        }


        td {
            padding: 9px 8px;

            border-bottom: 1px solid #dee2e6;

            font-size: 12px;

            vertical-align: top;

            white-space: normal;

            overflow-wrap: break-word;

            word-break: break-word;
        }


        tbody tr {
            transition: background-color 0.15s ease;
        }


        tbody tr:hover {
            background-color: #f8f9fa;
        }


        /* =========================
           COLUNA ARRASTAR
           ========================= */

        .coluna-arrastar {
            width: 40px;

            min-width: 40px;

            text-align: center;
        }


        .arrastar {
            width: 40px;

            text-align: center;

            font-size: 18px;

            color: #6c757d;

            cursor: grab;

            user-select: none;
        }


        .arrastar:hover {
            color: #0D3B66;
        }


        .arrastar:active {
            cursor: grabbing;
        }


        /* =========================
           LINHA SENDO ARRASTADA
           ========================= */

        tr.arrastando {
            opacity: 0.4;

            background-color: #e9ecef;
        }


        tr.destino-arraste {
            border-top: 3px solid #0D3B66;
        }


        /* =========================
           LARGURA DAS COLUNAS
           ========================= */

        th:nth-child(1),
        td:nth-child(1) {
            width: 40px;
        }


        /* razão social */

        th:nth-child(2),
        td:nth-child(2) {
            width: 14%;
        }


        /* início */

        th:nth-child(3),
        td:nth-child(3) {
            width: 9%;
        }


        /* previsão término */

        th:nth-child(4),
        td:nth-child(4) {
            width: 9%;
        }


        /* pedido */

        th:nth-child(5),
        td:nth-child(5) {
            width: 7%;
        }


        /* OP */

        th:nth-child(6),
        td:nth-child(6) {
            width: 8%;
        }


        /* código produto */

        th:nth-child(7),
        td:nth-child(7) {
            width: 9%;
        }


        /* descrição */

        th:nth-child(8),
        td:nth-child(8) {
            width: 14%;
        }


        /* etapa */

        th:nth-child(9),
        td:nth-child(9) {
            width: 6%;
        }


        /* descrição etapa */

        th:nth-child(10),
        td:nth-child(10) {
            width: 10%;
        }


        /* quantidade */

        th:nth-child(11),
        td:nth-child(11) {
            width: 7%;
        }


        /* ordem */

        th:nth-child(12),
        td:nth-child(12) {
            width: 5%;
        }


        /* =========================
           RESPONSIVO
           ========================= */

        @media (max-width: 1000px) {

            .container {
                max-width: 100%;
            }

            .card {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

        }


        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .card {
                padding: 12px;
            }

            h1 {
                font-size: 22px;
            }

            th,
            td {
                font-size: 11px;
                padding: 7px 6px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <h1>
            Chão de Fábrica
        </h1>


        <div class="tabela-container">


            <table>


                <thead>

                    <tr>

                        <!-- COLUNA ARRASTAR -->

                        <th class="coluna-arrastar">
                            ☰
                        </th>


                        {% if dados %}

                            {% for coluna in dados.0.keys %}

                                <th>
                                    {{ coluna }}
                                </th>

                            {% endfor %}

                        {% endif %}

                    </tr>

                </thead>


                <tbody id="tabela-chao-fabrica">


                    {% for linha in dados %}

                        <tr
                            draggable="true"
                            data-codigo-op="{{ linha.numero_CodOP }}"
                        >


                            <td class="arrastar">
                                ☰
                            </td>


                            {% for valor in linha.values %}

                                <td>
                                    {{ valor }}
                                </td>

                            {% endfor %}


                        </tr>


                    {% empty %}

                        <tr>

                            <td
                                colspan="100%"
                                style="
                                    text-align: center;
                                    padding: 30px;
                                "
                            >
                                Nenhum registro encontrado.
                            </td>

                        </tr>

                    {% endfor %}


                </tbody>


            </table>


        </div>


    </div>


    <!-- BOTÃO VOLTAR -->

    <a
        href="{% url 'relatorios_diversos' %}"
        class="btn-voltar"
    >
        ← Voltar para Relatórios
    </a>


</div>



<script>


/* ==========================================
   TABELA
   ========================================== */

const tabela =
    document.getElementById(
        "tabela-chao-fabrica"
    );


let linhaArrastada = null;


/* ==========================================
   INÍCIO DO ARRASTE
   ========================================== */

tabela.addEventListener(
    "dragstart",
    function(event) {

        const linha =
            event.target.closest("tr");


        if (!linha) {
            return;
        }


        linhaArrastada = linha;


        linha.classList.add(
            "arrastando"
        );


        event.dataTransfer.effectAllowed =
            "move";

    }
);


/* ==========================================
   DURANTE O ARRASTE
   ========================================== */

tabela.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();


        const linhaDestino =
            event.target.closest("tr");


        if (
            !linhaDestino ||
            linhaDestino === linhaArrastada
        ) {
            return;
        }


        linhaDestino.classList.add(
            "destino-arraste"
        );


        const retangulo =
            linhaDestino.getBoundingClientRect();


        const meio =
            retangulo.top +
            retangulo.height / 2;


        if (
            event.clientY < meio
        ) {

            tabela.insertBefore(
                linhaArrastada,
                linhaDestino
            );

        } else {

            tabela.insertBefore(
                linhaArrastada,
                linhaDestino.nextSibling
            );

        }

    }
);


/* ==========================================
   FINAL DO ARRASTE
   ========================================== */

tabela.addEventListener(
    "dragend",
    function(event) {

        const linha =
            event.target.closest("tr");


        if (linha) {

            linha.classList.remove(
                "arrastando"
            );

        }


        document
            .querySelectorAll(
                "#tabela-chao-fabrica tr"
            )
            .forEach(
                function(linha) {

                    linha.classList.remove(
                        "destino-arraste"
                    );

                }
            );


        linhaArrastada = null;


        salvarNovaOrdem();

    }
);


/* ==========================================
   SALVAR NOVA ORDEM
   ========================================== */

function salvarNovaOrdem() {

    const linhas =
        tabela.querySelectorAll("tr");


    const ordens = [];


    linhas.forEach(
        function(linha, index) {

            const codigoOp =
                linha.dataset.codigoOp;


            if (!codigoOp) {
                return;
            }


            ordens.push({

                numero_CodOP:
                    codigoOp,

                ordem:
                    index + 1

            });

        }
    );


    fetch(
        "{% url 'atualizar_ordem_chao_fabrica' %}",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json",

                "X-CSRFToken":
                    getCookie("csrftoken")

            },

            body:
                JSON.stringify(ordens)

        }
    )


    .then(
        function(response) {

            if (!response.ok) {

                throw new Error(
                    "Erro HTTP: " +
                    response.status
                );

            }

            return response.json();

        }
    )


    .then(
        function(data) {

            if (!data.sucesso) {

                throw new Error(
                    data.erro ||
                    "Erro ao salvar ordem."
                );

            }

            console.log(
                "Ordem salva com sucesso."
            );

        }
    )


    .catch(
        function(error) {

            console.error(
                "Erro ao salvar ordem:",
                error
            );

        }
    );

}


/* ==========================================
   CSRF
   ========================================== */

function getCookie(name) {

    let cookieValue = null;


    if (
        document.cookie &&
        document.cookie !== ""
    ) {

        const cookies =
            document.cookie.split(";");


        for (
            let i = 0;
            i < cookies.length;
            i++
        ) {

            const cookie =
                cookies[i].trim();


            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) ===
                (name + "=")
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;

            }

        }

    }


    return cookieValue;

}

</script>


</body>

</html>
