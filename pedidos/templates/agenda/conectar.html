<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conectar Agenda</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: #f5f7fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #1f2937;

        }


        .card {

            width: 100%;

            max-width: 480px;

            background: white;

            border-radius: 14px;

            padding: 32px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.08);

        }


        .icone {

            font-size: 42px;

            margin-bottom: 10px;

        }


        h1 {

            margin: 0;

            font-size: 25px;

        }


        .subtitulo {

            margin-top: 8px;

            margin-bottom: 28px;

            color: #6b7280;

            font-size: 14px;

            line-height: 1.5;

        }


        .campo {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

        }


        input:focus {

            border-color: #4f46e5;

        }


        .erro {

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 8px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 14px;

        }


        .botao {

            width: 100%;

            border: none;

            padding: 13px 18px;

            border-radius: 8px;

            background: #111827;

            color: white;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

        }


        .botao:hover {

            opacity: 0.9;

        }


        .aviso {

            margin-top: 18px;

            color: #6b7280;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;

        }

    </style>

</head>


<body>


    <div class="card">

        <div class="icone">
            📅
        </div>


        <h1>
            Conectar Agenda
        </h1>


        <div class="subtitulo">

            Conecte seu e-mail corporativo
            para visualizar seus convites
            de reunião no Portal Viesano.

        </div>


        {% if erro %}

            <div class="erro">

                ❌ {{ erro }}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="campo">

                <label for="email">
                    E-mail corporativo
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email_usuario }}"
                    placeholder="seu.email@viesano.com.br"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha do e-mail
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="botao"
            >

                🔐 Conectar minha agenda

            </button>


        </form>


        <div class="aviso">

            A senha é armazenada de forma
            criptografada para permitir a
            conexão automática nos próximos acessos.

        </div>

    </div>


</body>

</html>
