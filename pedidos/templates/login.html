{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Viesano</title>

    <link rel="icon"
          type="image/png"
          href="{% static 'img/logo_viesano.png' %}">

    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0D3B66">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0D3B66,#2EC4B6);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px 15px;
        }

        .login-card{
            width:100%;
            max-width:1050px;
            border:none;
            border-radius:24px;
            overflow:hidden;
            background:#fff;
        }

        .login-header{
            background:#0D3B66;
            text-align:center;
            padding:30px;
        }

        .login-body{
            padding:30px;
        }

        .btn-viesano{
            background:#0D3B66;
            border:none;
        }

        .btn-viesano:hover{
            background:#082744;
        }

        .logo{
            max-width:250px;
        }

        .login-area{
            max-width:450px;
            margin:auto;
        }

        .app-promo{
            min-height:100%;
            background:linear-gradient(145deg,#f8ffff,#edf9fa);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:35px;
        }

        .app-content{
            width:100%;
            max-width:500px;
            text-align:center;
        }

        .app-title{
            color:#0D3B66;
            font-size:30px;
            font-weight:700;
            margin-bottom:8px;
        }

        .app-subtitle{
            color:#64748b;
            font-size:17px;
            margin-bottom:25px;
        }

        .app-visual{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:25px;
        }

        .phone{
            width:210px;
            max-width:42%;
            filter:drop-shadow(0 15px 20px rgba(13,59,102,.15));
        }

        .qr-box{
            background:#fff;
            border-radius:18px;
            padding:14px;
            box-shadow:0 8px 25px rgba(13,59,102,.10);
        }

        .qr-box img{
            width:150px;
            height:150px;
            display:block;
        }

        .qr-text{
            color:#52657a;
            font-size:14px;
            line-height:1.4;
            margin-top:12px;
        }

        .app-label{
            color:#2EC4B6;
            font-size:13px;
            font-weight:700;
            letter-spacing:2px;
            margin-bottom:7px;
        }

        @media (max-width: 768px){
            body{
                padding:15px;
            }

            .login-card{
                max-width:450px;
            }

            .app-promo{
                padding:25px 20px 30px;
            }

            .app-title{
                font-size:24px;
            }

            .app-subtitle{
                font-size:15px;
            }

            .app-visual{
                gap:15px;
            }

            .phone{
                width:150px;
            }

            .qr-box img{
                width:120px;
                height:120px;
            }
        }
    </style>
</head>

<body>

<div class="card shadow-lg login-card">

    <div class="row g-0">

        <!-- LOGIN -->
        <div class="col-lg-6">

            <div class="login-header">
                <img src="{% static 'img/logo.png' %}"
                     class="logo"
                     alt="Viesano">

                <h4 class="mt-3 text-white">
                    Portal dos Sócios
                </h4>

                <p class="mt-3 text-white mb-0">
                    Visão executiva dos indicadores da Viesano
                </p>
            </div>

            <div class="login-body">
                <div class="login-area">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                Usuário
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Digite seu usuário">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Digite sua senha">
                        </div>

                        <button class="btn btn-viesano text-white w-100">
                            Entrar
                        </button>
                    </form>

                </div>
            </div>

        </div>

        <!-- APP -->
        <div class="col-lg-6">
            <div class="app-promo">

                <div class="app-content">

                    <div class="app-label">
                        APP VIESANO
                    </div>

                    <div class="app-title">
                        Acesse também no seu celular
                    </div>

                    <div class="app-subtitle">
                        Tenha o Portal Viesano sempre à mão.
                    </div>

                    <div class="app-visual">

                        <img
                            src="{% static 'img/phone-viesano.png' %}"
                            class="phone"
                            alt="Portal Viesano no celular">

                        <div>
                            <div class="qr-box">
                                <img
                                    src="{% static 'img/qrcode-viesano.png' %}"
                                    alt="QR Code para acessar o Portal Viesano">
                            </div>

                            <div class="qr-text">
                                Aponte a câmera do celular<br>
                                para acessar e instalar.
                            </div>
                        </div>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js")
        .then(() => console.log("Service Worker registrado!"))
        .catch(error => console.error("Erro no Service Worker:", error));
}
</script>

</body>
</html>
