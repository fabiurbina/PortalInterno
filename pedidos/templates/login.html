{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Viesano</title>

    <link rel="icon"
          type="image/png"
          href="{% static 'img/logo_viesano.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #ffffff;
    }

    .login-page {
        min-height: 100vh;
        display: flex;
    }

    /* =========================
       LADO DA IMAGEM
       ========================= */

    .image-side {
        width: 50%;
        min-height: 100vh;  
        background: #0D3B66;
        overflow: hidden;
    }

    .image-side img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* =========================
       DIVISÓRIA
       ========================= */

    .divider {
        width: 1px;
        background: #dfe5ea;
    }

    /* =========================
       LADO DO LOGIN
       ========================= */

    .login-side {
        width: 50%;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px;
        background: #ffffff;
    }

    .login-container {
        width: 100%;
        max-width: 430px;
    }

    .logo {
        max-width: 250px;
        display: block;
        margin: 0 auto 30px auto;
    }

    .login-title {
        text-align: center;
        color: #0D3B66;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .login-subtitle {
        text-align: center;
        color: #6c757d;
        margin-bottom: 35px;
    }

    .form-label {
        font-weight: 500;
        color: #333333;
    }

    .form-control {
        height: 48px;
        border-radius: 8px;
    }

    .btn-viesano {
        height: 48px;
        background: #0D3B66;
        border: none;
        border-radius: 8px;
    }

    .btn-viesano:hover {
        background: #082744;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 900px) {

        .image-side,
        .divider {
            display: none;
        }

        .login-side {
            width: 100%;
        }

    }

</style>

</head>

<body>

<div class="login-page">

    <!-- IMAGEM -->
    <div class="image-side">

        <img src="{% static 'img/logo.png' %}"
             alt="Viesano">

    </div>

    <!-- DIVISÓRIA -->
    <div class="divider"></div>

    <!-- LOGIN -->
    <div class="login-side">

        <div class="login-container">

            <img src="{% static 'img/logo.png' %}"
                 class="logo"
                 alt="Viesano">

            <h3 class="login-title">
                Portal Interno Viesano
            </h3>

            <p class="login-subtitle">
                Portal de acesso para colaboradores.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Login
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Digite seu login Ex: joao.silva">

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Digite sua senha">

                </div>

                <button
                    type="submit"
                    class="btn btn-viesano text-white w-100">

                    Entrar

                </button>

                <div class="text-center mt-3">

                    <a href="{% url 'password_reset' %}">
                        Esqueceu sua senha?
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
