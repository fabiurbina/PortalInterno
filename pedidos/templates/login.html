{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Portal Viesano</title>

    <link rel="icon"
          type="image/png"
          href="{% static 'img/logo_viesano.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        /* =========================
           ESTRUTURA PRINCIPAL
           ========================= */

        .login-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           LADO ESQUERDO
           ========================= */

        .image-side {
            width: 50%;
            min-height: 100vh;

            background: #0D3B66;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .image-side img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;
        }

        /* =========================
           DIVISÓRIA
           ========================= */

        .divider {
            width: 1px;
            min-height: 100vh;
            background: #dfe5ea;
            flex-shrink: 0;
        }

        /* =========================
           LADO DIREITO
           ========================= */

        .login-side {
            width: calc(50% - 1px);
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;

            background: #ffffff;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        /* =========================
           LOGO DO LOGIN
           ========================= */

        .logo {
            width: auto;
            max-width: 250px;
            max-height: 80px;

            object-fit: contain;

            display: block;

            margin: 0 auto 30px auto;
        }

        /* =========================
           TEXTOS
           ========================= */

        .login-title {
            text-align: center;

            color: #0D3B66;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;

            color: #6c757d;

            margin-bottom: 35px;
        }

        /* =========================
           FORMULÁRIO
           ========================= */

        .form-label {
            font-weight: 500;
            color: #333333;
        }

        .form-control {
            height: 48px;

            border-radius: 8px;

            border: 1px solid #ced4da;
        }

        .form-control:focus {
            border-color: #0D3B66;

            box-shadow: 0 0 0 0.15rem rgba(13, 59, 102, 0.15);
        }

        /* =========================
           BOTÃO
           ========================= */

        .btn-viesano {
            height: 48px;

            background: #0D3B66;

            border: none;

            border-radius: 8px;
        }

        .btn-viesano:hover {
            background: #082744;
        }

        /* =========================
           LINK
           ========================= */

        .login-container a {
            color: #0D3B66;
        }

        /* =========================
           RESPONSIVO
           ========================= */

        @media (max-width: 900px) {

            .image-side {
                display: none;
            }

            .divider {
                display: none;
            }

            .login-side {
                width: 100%;
                min-height: 100vh;

                padding: 30px 20px;
            }

            .login-container {
                max-width: 430px;
            }

        }

    </style>

</head>


<body>

<div class="login-page">


    <!-- =========================
         LADO ESQUERDO
         ========================= -->

    <div class="image-side">

        <img src="{% url 'login_destaque' %}"
     alt="Viesano Suplementos">

    </div>


    <!-- =========================
         DIVISÓRIA
         ========================= -->

    <div class="divider"></div>


    <!-- =========================
         LADO DIREITO
         ========================= -->

    <div class="login-side">

        <div class="login-container">



            <!-- TÍTULO -->

            <h3 class="login-title">
                Portal Interno Viesano
            </h3>


            <!-- SUBTÍTULO -->

            <p class="login-subtitle">
                Portal de acesso para colaboradores.
            </p>


            <!-- FORMULÁRIO -->

            <form method="POST">

                {% csrf_token %}


                <!-- LOGIN -->

                <div class="mb-3">

                    <label class="form-label">
                        Login
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Digite seu login Ex: joao.silva">

                </div>


                <!-- SENHA -->

                <div class="mb-4">

                    <label class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Digite sua senha">

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn btn-viesano text-white w-100">

                    Entrar

                </button>


                <!-- RECUPERAÇÃO -->

                <div class="text-center mt-3">

                    <a href="{% url 'password_reset' %}">
                        Esqueceu sua senha?
                    </a>

                </div>


            </form>


        </div>

    </div>

</div>

</body>

</html>
