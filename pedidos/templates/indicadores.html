<!DOCTYPE html>
{% load static %}
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Indicadores - Viesano</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        .ai-response{
            font-size:16px;
            color:#343a40;
            line-height:1.8;
        }

        .ai-response h1{
            color:#0D3B66;
            border-bottom:2px solid #2EC4B6;
            padding-bottom:10px;
            margin-top:25px;
        }

        .ai-response h2{
            color:#0D6EFD;
            margin-top:20px;
        }

        .ai-response p{
            line-height:1.8;
            margin-bottom:15px;
        }

        .ai-response strong{
            color:#0D6EFD;
        }

        .ai-response ul{
            padding-left:25px;
        }

        .ai-response li{
            margin-bottom:8px;
        }

    </style>

</head>

<body style="background-color:#f4f6f9;">

    <!-- Cabeçalho -->
    <div style="
        background: linear-gradient(90deg,#0D3B66,#2EC4B6);
        padding:25px;
        text-align:center;">

        <img src="{% static 'img/logo.png' %}"
             style="max-width:300px;">

    </div>

    <!-- Conteúdo -->
    <div class="d-flex gap-2 mb-3">

    <button
        class="btn btn-lg shadow"
        style="
            background:linear-gradient(90deg,#0D6EFD,#2EC4B6);
            color:white;
            border:none;
            border-radius:12px;"
        data-bs-toggle="modal"
        data-bs-target="#modalIA"
        onclick="buscarAnalise('comercial')">

        🤖 Interpretação do CRM

    </button>

    <button
        class="btn btn-lg shadow"
        style="
            background:linear-gradient(90deg,#198754,#20c997);
            color:white;
            border:none;
            border-radius:12px;"
        data-bs-toggle="modal"
        data-bs-target="#modalIA"
        onclick="buscarAnalise('producao')">

        🏭 Interpretação da Produção

    </button>

</div>

        <iframe
            src="https://app.powerbi.com/view?r=eyJrIjoiZmNhNjE2OTUtNjRkMy00ODQ4LWJmM2UtMTdiODQ1NTU5YWQwIiwidCI6IjZkZWRkNGE3LThiOTAtNDk0Ny1hM2UzLWRmNjg2MjFmYWQ5YiJ9"
            width="100%"
            height="850"
            style="border:none;"
            allowfullscreen>
        </iframe>

        <div class="mt-3">

            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                ← Voltar
            </a>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalIA" tabindex="-1">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h4 id="tituloModal">🤖 Interpretação com IA</h4>

                    <button class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div id="resultadoIA">

                        Clique em <strong>Gerar análise</strong>.

                    </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Fechar
                    </button>
                </div>

            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script>

        function buscarAnalise(tipo){

    let url = "";
    let titulo = "";
    let loading = "";

    if(tipo === "comercial"){

        url = "{% url 'analise_comercial' %}";
        titulo = "🤖 Interpretação do CRM com IA";
        loading = "Analisando o CRM...";

    }else{

        url = "{% url 'analise_producao' %}";
        titulo = "🏭 Interpretação da Produção com IA";
        loading = "Analisando a Produção...";

    }

    document.getElementById("tituloModal").innerHTML = titulo;

    document.getElementById("resultadoIA").innerHTML = `
        <div class="text-center p-5">
            <div class="spinner-border text-primary mb-3"></div>
            <h5>${loading}</h5>
        </div>
    `;

    fetch(url)
        .then(response => response.text())
        .then(html => {

            document.getElementById("resultadoIA").innerHTML =
                `<div class="ai-response">${html}</div>`;

        })
        .catch(() => {

            document.getElementById("resultadoIA").innerHTML = `
                <div class="alert alert-danger">
                    Erro ao gerar a análise.
                </div>
            `;

        });

}

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
