<!DOCTYPE html>
{% load static %}
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Indicadores - Viesano</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background-color:#f4f6f9;">

    <!-- Cabeçalho -->
    <div style="
        background: linear-gradient(90deg,#0D3B66,#2EC4B6);
        padding:25px;
        text-align:center;">

        <img src="{% static 'img/logo.png' %}"
             style="max-width:300px;">

    </div>

    <!-- Conteúdo -->
    <div class="container-fluid mt-4">

        <button
            class="btn btn-lg shadow mb-3"
            style="
                background:linear-gradient(90deg,#0D6EFD,#2EC4B6);
                color:white;
                border:none;
                border-radius:12px;"
            data-bs-toggle="modal"
            data-bs-target="#modalIA">

            🤖 Interpretação do CRM com IA

        </button>

        <iframe
            src="https://app.powerbi.com/view?r=eyJrIjoiZmNhNjE2OTUtNjRkMy00ODQ4LWJmM2UtMTdiODQ1NTU5YWQwIiwidCI6IjZkZWRkNGE3LThiOTAtNDk0Ny1hM2UzLWRmNjg2MjFmYWQ5YiJ9"
            width="100%"
            height="850"
            style="border:none;"
            allowfullscreen>
        </iframe>

        <div class="mt-3">

            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                ← Voltar
            </a>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalIA" tabindex="-1">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h4>🤖 Interpretação do CRM com IA</h4>

                    <button class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div id="resultadoIA">

                        Clique em <strong>Gerar análise</strong>.

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-primary"
                        onclick="buscarAnalise()">

                        Gerar análise

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script>

        function buscarAnalise(){

            document.getElementById("resultadoIA").innerHTML =
                `
                <div class="text-center p-5">
                    <div class="spinner-border text-primary mb-3"></div>
                    <h5>Analisando o CRM...</h5>
                </div>
                `;

            fetch("{% url 'analise_comercial' %}")

            .then(response => response.text())

            .then(html => {

                document.getElementById("resultadoIA").innerHTML = html;

            });

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
